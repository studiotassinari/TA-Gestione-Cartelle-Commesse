name: Installer Windows
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'TA-Gestione Cartelle Commesse/**'
      - 'installer.iss'
      - '.github/workflows/installer.yml'
permissions:
  contents: write
concurrency:
  group: installer-release
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pubblica applicazione con runtime incluso
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          dotnet publish 'TA-Gestione Cartelle Commesse/TA-Gestione Cartelle Commesse.csproj' -c Release -r win-x64 --self-contained true -p:Version=$version -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { throw 'Compilazione non riuscita' }
      - name: Crea installatore
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installazione compilatore non riuscita' }
          }
          & $compiler "/DAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Creazione installer non riuscita' }
      - name: Verifica installazione, avvio e disinstallazione
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'TA-Installer-Test'
          $setup = (Resolve-Path 'artifacts/installer/TA-Gestione-Cartelle-Commesse-Setup.exe').Path
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="' + $destination + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installazione fallita: $($install.ExitCode)" }
          $exe = Join-Path $destination 'TA-Gestione Cartelle Commesse.exe'
          if (!(Test-Path $exe)) { throw 'Eseguibile installato assente' }
          $app = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 5
            $app.Refresh()
            if ($app.HasExited) { throw 'Applicazione terminata durante avvio' }
            if (!$app.WaitForInputIdle(15000)) { throw 'Applicazione non pronta' }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
          $uninstall = Start-Process -FilePath (Join-Path $destination 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path $exe)) { throw 'Disinstallazione non riuscita' }
      - name: Calcola impronta SHA256
        run: |
          $setup = 'artifacts/installer/TA-Gestione-Cartelle-Commesse-Setup.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TA-Gestione-Cartelle-Commesse-Setup.exe" | Set-Content 'artifacts/installer/SHA256SUMS.txt' -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: artifacts/installer/*
          if-no-files-found: error
      - name: Pubblica release scaricabile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Installatore Windows x64 con .NET 10 incluso.
          Scaricare TA-Gestione-Cartelle-Commesse-Setup.exe e avviarlo.
          Installazione per utente, collegamento nel menu Start e disinstallazione inclusi.
          Per leggere le cartelle occorre accesso alla rete aziendale e ai percorsi selezionati.
          Commesse: verifica esclusivamente del primo livello sotto ogni anno.
          Il pacchetto non contiene cartelle, dati clienti o report della rete aziendale.
          Installer non firmato digitalmente. Impronta disponibile in SHA256SUMS.txt.
          '@
          $notes | Set-Content release-notes.txt -Encoding utf8
          gh release create "v$env:APP_VERSION" 'artifacts/installer/TA-Gestione-Cartelle-Commesse-Setup.exe' 'artifacts/installer/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "TA-Gestione Cartelle Commesse $env:APP_VERSION" --notes-file release-notes.txt --latest
          if ($LASTEXITCODE -ne 0) { throw 'Pubblicazione release non riuscita' }
