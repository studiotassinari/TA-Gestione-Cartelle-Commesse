name: Installer Windows
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'TA-Gestione Cartelle Commesse/**'
      - 'installer.iss'
      - '.github/workflows/installer.yml'
permissions:
  contents: write
concurrency:
  group: installer-release
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pubblica applicazione con runtime incluso
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          dotnet publish 'TA-Gestione Cartelle Commesse/TA-Gestione Cartelle Commesse.csproj' -c Release -r win-x64 --self-contained true -p:Version=$version -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { throw 'Compilazione non riuscita' }
      - name: Crea installatore
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installazione compilatore non riuscita' }
          }
          & $compiler "/DAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Creazione installer non riuscita' }
      - name: Verifica aggiornamento da 1.0.2, reinstallazione, avvio e disinstallazione
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'TA-Installer-Test'
          $setup = (Resolve-Path 'artifacts/installer/TA-Gestione-Cartelle-Commesse-Setup.exe').Path
          $previousDir = Join-Path $env:RUNNER_TEMP 'TA-Previous-Installer'
          gh release download v1.0.2 --repo $env:GITHUB_REPOSITORY --pattern 'TA-Gestione-Cartelle-Commesse-Setup.exe' --dir $previousDir
          if ($LASTEXITCODE -ne 0) { throw 'Download versione precedente non riuscito' }
          $previousSetup = Join-Path $previousDir 'TA-Gestione-Cartelle-Commesse-Setup.exe'
          $install = Start-Process -FilePath $previousSetup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="' + $destination + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installazione 1.0.2 fallita: $($install.ExitCode)" }
          $exe = Join-Path $destination 'TA-Gestione Cartelle Commesse.exe'
          if ((Get-Item $exe).VersionInfo.FileVersion -ne '1.0.2.0') { throw 'Versione precedente non installata' }
          $roots = @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')
          function Get-TaEntries {
            @(Get-ItemProperty $roots -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -eq '{D0B63D8F-FF51-4B68-9553-4B49A78C7B3A}_is1' -or $_.DisplayName -like 'TA-Gestione Cartelle Commesse*' })
          }
          # Senza /DIR: deve riconoscere e riutilizzare la cartella della 1.0.2.
          foreach ($attempt in 1..2) {
            $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -WindowStyle Hidden -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Aggiornamento/reinstallazione fallita: $($install.ExitCode)" }
            $entries = @(Get-TaEntries)
            if ($entries.Count -ne 1 -or $entries[0].DisplayVersion -ne $env:APP_VERSION) { throw 'Versione precedente o voci duplicate rimaste nel registro' }
            if ((Get-Item $exe).VersionInfo.FileVersion -ne "$env:APP_VERSION.0") { throw 'File installati non aggiornati' }
            if ((Get-FileHash $exe).Hash -ne (Get-FileHash 'artifacts/publish/TA-Gestione Cartelle Commesse.exe').Hash) { throw 'Eseguibile installato diverso dal programma pubblicato' }
            if (@(Get-ChildItem $destination -Filter 'unins*.exe').Count -ne 1) { throw 'Disinstallatori duplicati' }
          }
          $shortcutPath = Join-Path ([Environment]::GetFolderPath('Programs')) 'TA-Gestione Cartelle Commesse\TA-Gestione Cartelle Commesse.lnk'
          $shell = New-Object -ComObject WScript.Shell
          if (!(Test-Path $shortcutPath) -or $shell.CreateShortcut($shortcutPath).TargetPath -ne $exe) { throw 'Collegamento Start non punta al programma installato' }
          if (Select-String -Path installer.iss -Pattern '^\s*\[Run\]' -Quiet) { throw 'Il setup non deve eseguire processi dopo Fine' }
          if (!(Test-Path $exe)) { throw 'Eseguibile installato assente' }
          $app = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 5
            $app.Refresh()
            if ($app.HasExited) { throw 'Applicazione terminata durante avvio' }
            if (!$app.WaitForInputIdle(15000)) { throw 'Applicazione non pronta' }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
          $uninstall = Start-Process -FilePath (Join-Path $destination 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path $exe)) { throw 'Disinstallazione non riuscita' }
          if (@(Get-TaEntries).Count -ne 0 -or (Test-Path $shortcutPath)) { throw 'Registrazione o collegamento residui dopo disinstallazione' }
      - name: Calcola impronta SHA256
        run: |
          $setup = 'artifacts/installer/TA-Gestione-Cartelle-Commesse-Setup.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TA-Gestione-Cartelle-Commesse-Setup.exe" | Set-Content 'artifacts/installer/SHA256SUMS.txt' -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: artifacts/installer/*
          if-no-files-found: error
      - name: Pubblica release scaricabile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Installatore aggiornato: Fine chiude il setup senza avvii automatici.
          Avviare il programma dal menu Start dopo l'installazione.
          Aggiornamento dalla 1.0.2 e reinstallazione verificati: file sostituiti, una sola voce nelle App installate.
          La versione precedente viene aggiornata nella stessa cartella, senza disinstallazione manuale.

          Novità: grafica Tassinari Associati con logo, font Acherus Grotesque e colori aziendali.
          Menu Export per report HTML con logo e font incorporati.
          Apertura cartelle con doppio clic, menu contestuale e menu Apri.

          Installatore Windows x64 con .NET 10 incluso.
          Scaricare TA-Gestione-Cartelle-Commesse-Setup.exe e avviarlo.
          Installazione per utente, collegamento nel menu Start e disinstallazione inclusi.
          Per leggere le cartelle occorre accesso alla rete aziendale e ai percorsi selezionati.
          Commesse: verifica esclusivamente del primo livello sotto ogni anno.
          Il pacchetto non contiene cartelle, dati clienti o report della rete aziendale.
          Installer non firmato digitalmente. Impronta disponibile in SHA256SUMS.txt.
          '@
          $notes | Set-Content release-notes.txt -Encoding utf8
          gh release create "v$env:APP_VERSION" 'artifacts/installer/TA-Gestione-Cartelle-Commesse-Setup.exe' 'artifacts/installer/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "TA-Gestione Cartelle Commesse $env:APP_VERSION" --notes-file release-notes.txt --latest
          if ($LASTEXITCODE -ne 0) { throw 'Pubblicazione release non riuscita' }
